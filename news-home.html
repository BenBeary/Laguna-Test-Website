<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | Laguna Games</title>
    <link rel="icon" type="image/png" href="images/laguna-posters/laguna_logo_4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Finlandica+Text:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="news" data-root="">
    <div class="bg-parallax" aria-hidden="true"></div>
    <div class="starfield-host" aria-hidden="true"></div>

    <div id="site-header"></div>

    <main>
        <section class="news-listing" data-news-listing data-page-size="6">
            <h1 class="section-title news-listing-title">NEWS</h1>
            <div class="news-controls">
                <div class="news-search">
                    <input type="search" placeholder="Search by title or date" aria-label="Search news">
                </div>
                <div class="filter-dropdown" data-news-filter>
                    <button class="filter-dropdown-toggle" type="button" aria-expanded="false" aria-haspopup="true">
                        <span class="filter-dropdown-label">All Games</span>
                        <span class="filter-dropdown-caret" aria-hidden="true"></span>
                    </button>
                    <ul class="filter-dropdown-menu" role="menu"></ul>
                </div>
            </div>
            <div class="news-grid"></div>
            <div class="news-pagination" role="navigation" aria-label="Pagination"></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/partials.js"></script>
    <script src="js/stars.js"></script>
    <script src="js/news-grabber.js"></script>
</body>
</html>
