<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team | Laguna Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Finlandica+Text:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="team" data-root="">
    <div class="bg-parallax" aria-hidden="true"></div>
    <div class="starfield-host" aria-hidden="true"></div>

    <div id="site-header"></div>

    <main>
        <section class="team-page">
            <h1 class="section-title team-page-title">The Team</h1>

            <div class="team-grid">
                <article class="team-card">
                    <div class="team-card-photo">
                        <img src="images/misc/Placeholder_1-1.jpg" alt="Member name">
                    </div>
                    <h2 class="team-card-name">Member Name</h2>
                    <div class="team-card-roles">
                        <span class="role-tag">Programmer</span>
                        <span class="role-tag">Designer</span>
                    </div>
                    <a class="btn-outline" href="#">Portfolio</a>
                </article>

                <article class="team-card">
                    <div class="team-card-photo">
                        <img src="images/misc/Placeholder_1-1.jpg" alt="Member name">
                    </div>
                    <h2 class="team-card-name">Member Name</h2>
                    <div class="team-card-roles">
                        <span class="role-tag">Artist</span>
                        <span class="role-tag">Animator</span>
                        <span class="role-tag">UI</span>
                    </div>
                    <a class="btn-outline" href="#">Portfolio</a>
                </article>

                <article class="team-card">
                    <div class="team-card-photo">
                        <img src="images/misc/Placeholder_1-1.jpg" alt="Member name">
                    </div>
                    <h2 class="team-card-name">Member Name</h2>
                    <div class="team-card-roles">
                        <span class="role-tag">Audio</span>
                    </div>
                    <a class="btn-outline" href="#">Portfolio</a>
                </article>

                <article class="team-card">
                    <div class="team-card-photo">
                        <img src="images/misc/Placeholder_1-1.jpg" alt="Member name">
                    </div>
                    <h2 class="team-card-name">Member Name</h2>
                    <div class="team-card-roles">
                        <span class="role-tag">Programmer</span>
                        <span class="role-tag">Tools</span>
                    </div>
                    <a class="btn-outline" href="#">Portfolio</a>
                </article>

                <article class="team-card">
                    <div class="team-card-photo">
                        <img src="images/misc/Placeholder_1-1.jpg" alt="Member name">
                    </div>
                    <h2 class="team-card-name">Member Name</h2>
                    <div class="team-card-roles">
                        <span class="role-tag">Writer</span>
                        <span class="role-tag">Narrative</span>
                        <span class="role-tag">Designer</span>
                    </div>
                    <a class="btn-outline" href="#">Portfolio</a>
                </article>

                <article class="team-card">
                    <div class="team-card-photo">
                        <img src="images/misc/Placeholder_1-1.jpg" alt="Member name">
                    </div>
                    <h2 class="team-card-name">Member Name</h2>
                    <div class="team-card-roles">
                        <span class="role-tag">Producer</span>
                    </div>
                    <a class="btn-outline" href="#">Portfolio</a>
                </article>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/partials.js"></script>
    <script src="js/stars.js"></script>
</body>
</html>
