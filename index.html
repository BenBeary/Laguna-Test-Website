<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laguna Games</title>
    <link rel="icon" type="image/png" href="images/laguna-posters/laguna_logo_4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Finlandica+Text:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/slideshow.css">
</head>
<body data-page="home" data-root="">
    <div class="bg-parallax" aria-hidden="true"></div>
    <div class="starfield-host" aria-hidden="true"></div>

    <div id="site-header"></div>

    <main>
        <section class="hero-logo" aria-label="Laguna Games">
            <div class="logo-stack">
                <img src="images/svg/laguna_logo_Bottom.svg" alt="" class="logo-layer logo-bottom" aria-hidden="true">
                <img src="images/svg/laguna_logo_Top.svg" alt="Laguna Games" class="logo-layer logo-top">
            </div>
        </section>

        <section class="slideshow" aria-roledescription="carousel" aria-label="Featured games" data-slides-src="json/games.json">
            <h2 class="section-title slideshow-title">OUR GAMES</h2>

            <div class="slideshow-viewport">
                <div class="slideshow-track" id="slideshow-track"></div>
            </div>

            <div class="slideshow-controls">
                <button class="slideshow-arrow slideshow-arrow-prev" id="slideshow-prev" aria-label="Previous slide">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="slideshow-dots" id="slideshow-dots" role="tablist"></div>
                <button class="slideshow-arrow slideshow-arrow-next" id="slideshow-next" aria-label="Next slide">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </section>

        <section class="news-preview">
            <div class="news-preview-header">
                <h2 class="section-title news-preview-title">RECENT NEWS</h2>
                <a class="news-preview-more" href="news-home.html">See All &rarr;</a>
            </div>
            <div class="news-list" data-news-preview="3"></div>
        </section>

        <section class="about-team">
            <div class="about-team-grid">
                <h2 class="section-title about-team-title">ABOUT THE TEAM</h2>
                <div class="about-team-image">
                    <img src="images/misc/Placeholder.jpg" alt="The Laguna team">
                </div>
                <div class="about-team-text">
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
                    <a class="btn-outline" href="team.html">Meet the Team</a>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/partials.js"></script>
    <script src="js/stars.js"></script>
    <script src="js/slideshow.js"></script>
    <script src="js/news-grabber.js"></script>
</body>
</html>
